<h4>绕过技巧</h4>
<ul>
<li><b>失败次数锁定</b>：换 IP（代理池）、伪造 <code>X-Forwarded-For</code>、换用户名大小写或前后加空格、分时段慢速爆破。</li>
<li><b>账号枚举</b>：根据"用户不存在/密码错误"的提示差异或响应时间差异，先筛出有效账号。</li>
<li><b>强密码策略</b>：优先试业务相关弱口令（公司名/项目名 + 年份、<code>admin@2026</code>、<code>用户名+123</code>）。</li>
<li><b>接口有频率限制</b>：降低线程到 1~5，加随机延时，或用 Burp 的 <code>Intruder</code> 资源池单线程慢跑。</li>
</ul>
