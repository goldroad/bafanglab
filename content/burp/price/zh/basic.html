<h4>漏洞描述</h4>
<p>金额/数量篡改：商品价格、数量、折扣等关键业务参数由客户端提交，服务端未校验，攻击者改包即可用超低价格购买或超额退款。</p>
<h4>挖掘技巧与经验</h4>
<ul>
<li>拦截下单、支付、退款请求，重点关注 <code>price</code>、<code>amount</code>、<code>quantity</code>、<code>discount</code>、<code>total</code>。</li>
<li>尝试修改为 0、0.01、负数、超大值，观察业务校验分支。</li>
<li>同时修改商品 ID 与价格，测试服务端是否校验"商品与价格对应关系"。</li>
<li>拦截响应后回放/改包，测试"支付成功"状态是否由客户端控制。</li>
</ul>
