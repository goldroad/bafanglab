<h4>绕过技巧</h4>
<ul>
<li><b>参数名变形</b>：大小写、<code>debug[]=1</code>、<code>debug[0]=1</code>、<code>debug.1</code>、URL 编码 <code>%64ebug</code>。</li>
<li><b>参数位置变形</b>：放到 Cookie、Header、JSON Body，或路径分号参数 <code>;debug=1</code>。</li>
<li><b>被 WAF 拦截</b>：分段提交 <code>de</code> 与 <code>bug</code>；GET 传 <code>debug=0</code> 同时 POST 传 <code>debug=1</code>（参数污染）。</li>
<li><b>值校验过严</b>：<code>1</code>/<code>true</code>/<code>on</code>/<code>yes</code>/<code>TRUE</code> 逐个试，再顺手试 <code>admin=1</code>、<code>isadmin=true</code>。</li>
</ul>
